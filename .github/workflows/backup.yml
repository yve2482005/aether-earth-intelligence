name: backup

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Backup database + Drive archive
        run: |
          mkdir -p data/backups
          test -f data/aether.db || { echo "ERROR: data/aether.db missing - run scripts/init_db.py first"; exit 1; }
          cp data/aether.db "data/backups/aether-$(date -u +%Y%m%dT%H%M%SZ).db"
          python -c "from backend.integrations.drive import DriveArchive; print(DriveArchive().upload_parquet_or_json(\"data/aether.db\", \"WEATHER\"))" || { echo "Drive archive skipped/failed - local backup kept"; exit 1; }

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Full pytest suite
        run: python -m pytest tests/ -q
      - name: Leakage tests (required when ML team lands them)
        run: |
          if ls tests/test_ml_leakage.py >/dev/null 2>&1; then
            python -m pytest tests/test_ml_leakage.py -q
          else
            echo "ML leakage tests not landed yet (ML team) - skipping"
          fi
